name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2-app/package-lock.json

      - name: Install V2 deps
        run: npm ci
        working-directory: v2-app

      - name: Build V2
        run: npm run build
        working-directory: v2-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

      - name: Assemble deploy folder
        run: |
          mkdir -p _deploy/v2

          # MVP1 root files
          cp index.html _deploy/
          cp manifest.json _deploy/
          cp icon_180.png icon_192.png icon_512.png _deploy/
          [ -f favicon.ico ] && cp favicon.ico _deploy/ || true

          # Old v2/ helper scripts (keep for MVP1 compatibility)
          cp -r v2/. _deploy/v2/

          # V2 Svelte build — overwrites/merges into v2/
          cp -r v2-dist/. _deploy/v2/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
          publish_branch: gh-pages
          force_orphan: false
