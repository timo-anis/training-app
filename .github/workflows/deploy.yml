name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------
  # RLS adversarial matrix — runs only when SUPABASE_DB_URL is set.
  # Add the secret in GitHub → Settings → Secrets & variables →
  # Actions → New repository secret (name: SUPABASE_DB_URL).
  # The value is your Supabase direct postgres connection string:
  #   postgresql://postgres:[password]@db.[ref].supabase.co:5432/postgres
  # ----------------------------------------------------------------
  rls-tests:
    runs-on: ubuntu-latest
    if: ${{ vars.RLS_TESTS_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Run messages RLS adversarial matrix
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            --host="${{ secrets.SUPABASE_DB_HOST }}" \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/rls-tests/messages-adversarial.sql

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2-app/package-lock.json

      - name: Install V2 deps
        run: npm ci
        working-directory: v2-app

      - name: Run tests
        run: npm test
        working-directory: v2-app

      - name: TypeScript & Svelte check
        run: npm run check
        working-directory: v2-app

      - name: Build V2
        run: npm run build
        working-directory: v2-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

      - name: Assemble deploy folder
        run: |
          mkdir -p _deploy

          # V2 Svelte build — deploy to root
          cp -r v2-dist/. _deploy/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
          publish_branch: gh-pages
          force_orphan: false
